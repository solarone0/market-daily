name: daily

on:
  schedule:
    - cron: "0 22 * * *" # 매일 07:00 KST (미국장 마감 뒤)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: 시장 지표 수집
        run: python scripts/fetch_market.py

      - name: 칼럼 작성
        if: ${{ env.ANTHROPIC_API_KEY != '' }}
        continue-on-error: true # 칼럼이 실패해도 지표는 올린다
        run: python scripts/write_column.py

      - name: 커밋
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "daily: $(TZ=Asia/Seoul date +%F)"
          git push

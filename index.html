<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Market Daily</title>
<meta name="description" content="해외 외신으로 읽는 매일의 경제 칼럼과 주요 지표">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<header class="masthead">
  <div class="wrap">
    <p class="dateline" id="dateline"></p>
    <h1 class="logo"><a href="./">MARKET DAILY</a></h1>
    <p class="tagline">해외 외신으로 읽는 오늘의 경제</p>
  </div>
</header>

<nav class="ticker" aria-label="주요 지표">
  <div class="wrap" id="ticker"></div>
</nav>

<main class="wrap layout">
  <article class="column" id="column">
    <p class="muted">칼럼을 불러오는 중…</p>
  </article>

  <aside class="markets">
    <div class="markets-head">
      <h2>시장</h2>
      <div class="range" role="group" aria-label="기간">
        <button data-range="22">1M</button>
        <button data-range="66" class="on">3M</button>
        <button data-range="0">6M</button>
      </div>
    </div>
    <div id="charts"></div>
    <p class="muted small" id="updated"></p>

    <section class="archive">
      <h2>지난 칼럼</h2>
      <ol id="archive"></ol>
    </section>
  </aside>
</main>

<footer class="wrap footer">
  <p>자료: Yahoo Finance(지표), Financial Times · Nikkei Asia · Yahoo Finance 외(칼럼). 칼럼은 AI가 외신을 검색해 작성하며 투자 권유가 아닙니다.</p>
</footer>

<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
<script src="assets/app.js"></script>
</body>
</html>
